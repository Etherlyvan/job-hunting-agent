name: GPT application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: jobagent_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: jobagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobagent_test -d jobagent_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://jobagent_test:disposable-ci-only@localhost:5432/jobagent_test
      ALLOW_TEST_DATABASE_WRITES: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm audit --omit=dev
      - run: npm run build
