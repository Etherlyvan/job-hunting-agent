services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobagent:${POSTGRES_PASSWORD}@db:5432/jobagent
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobagent:${POSTGRES_PASSWORD}@db:5432/jobagent
      HOSTNAME: 0.0.0.0
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set APP_ACCESS_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
